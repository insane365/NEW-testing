<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM QUALITY TOOL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: rgba(18, 24, 36, 0.8);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            text-align: center;
            width: 320px;
        }

        .auth-card h2 {
            margin-top: 0;
            color: #00f2ff;
            letter-spacing: 2px;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .auth-card p {
            color: #8a99ad;
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f2ff 0%, #0066ff 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        }

        .credits {
            margin-top: 30px;
            font-size: 11px;
            color: #5d6d7e;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .social-links a {
            color: #8a99ad;
            text-decoration: none;
            font-size: 12px;
        }

        #app-content {
            display: none;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2>SECURITY CHECK</h2>
            <p id="auth-msg">VERIFYING IDENTITY...</p>
            <div class="input-group">
                <input type="text" id="licenseKeyInput" placeholder="Enter License Key">
            </div>
            <button class="auth-btn" id="authBtn" onclick="handleAuth()">VERIFY</button>

            <div class="credits">MADE WITH ♥ BY.</div>
            <div class="social-links">
                <a href="https://tiktok.com/@insane_365" target="_blank">TikTok: @insane_365</a>
                <a href="https://instagram.com/insane_365" target="_blank">IG: @insane_365</a>
            </div>
        </div>
    </div>

    <div id="app-content"></div>

    <script>
        // Set this EXACTLY to the passphrase used during CryptoJS.AES.encrypt
        const DECRYPTION_PASSPHRASE = "YOUR_EXACT_PASSPHRASE_HERE";

        async function handleAuth() {
            const keyInput = document.getElementById('licenseKeyInput').value.trim();
            runDecryptionPipeline(keyInput);
        }

        async function runDecryptionPipeline(licenseKey) {
            const authMsg = document.getElementById('auth-msg');

            if (authMsg) {
                authMsg.innerText = "PROCESSING DECRYPTION...";
                authMsg.style.color = "#00f2ff";
            }

            try {
                const response = await fetch('app.enc');
                if (!response.ok) {
                    throw new Error("Unable to locate app.enc file.");
                }
                const encryptedData = (await response.text()).trim();

                // Decrypt into WordArray first
                const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, DECRYPTION_PASSPHRASE);

                // Safe conversion to UTF-8 string
                let decryptedText = "";
                try {
                    decryptedText = decryptedBytes.toString(CryptoJS.enc.Utf8);
                } catch (e) {
                    throw new Error("Incorrect decryption passphrase or corrupted payload.");
                }

                if (!decryptedText) {
                    throw new Error("Decryption returned empty string. Verify passphrase.");
                }

                localStorage.setItem('INSANE_key', licenseKey);

                const authScreen = document.getElementById('auth-screen');
                if (authScreen) authScreen.remove();

                const appContent = document.getElementById('app-content');
                if (appContent) appContent.style.display = 'block';

                const scriptEl = document.createElement('script');
                scriptEl.text = decryptedText;
                document.body.appendChild(scriptEl);

            } catch (err) {
                console.error(err);
                alert(err.message);
                if (authMsg) {
                    authMsg.innerText = "FAILED";
                    authMsg.style.color = "#ff3366";
                }
            }
        }
    </script>
</body>
</html>
